<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>Formd logo 预览</title>
<style>
body{font-family:-apple-system,sans-serif;background:#F8FAFC;padding:40px;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1000px;margin:auto}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 20px #0f172a10;text-align:center}
.row{display:flex;gap:12px;justify-content:center;margin:16px 0}
.box{width:140px;height:140px;border-radius:30px;display:flex;align-items:center;justify-content:center}
.l{background:#F1F5F9}.d{background:#0F172A}
.sm{display:flex;gap:14px;justify-content:center;align-items:center}
.sm img:nth-child(1){width:32px}.sm img:nth-child(2){width:24px}.sm img:nth-child(3){width:16px}
</style></head><body><div class="grid">
<div class="card"><h3>1. flow-m</h3><div class="row"><div class="box l"><img src="flow-m.svg" width="96"></div><div class="box d"><img src="flow-m.svg" width="96"></div></div><div class="sm"><img src="flow-m.svg"><img src="flow-m.svg"><img src="flow-m.svg"></div></div>
<div class="card"><h3>2. sync-hash</h3><div class="row"><div class="box l"><img src="sync-hash.svg" width="96"></div><div class="box d"><img src="sync-hash.svg" width="96"></div></div><div class="sm"><img src="sync-hash.svg"><img src="sync-hash.svg"><img src="sync-hash.svg"></div></div>
<div class="card"><h3>3. flow-f</h3><div class="row"><div class="box l"><img src="flow-f.svg" width="96"></div><div class="box d"><img src="flow-f.svg" width="96"></div></div><div class="sm"><img src="flow-f.svg"><img src="flow-f.svg"><img src="flow-f.svg"></div></div>
</div></body></html>
