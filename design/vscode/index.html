<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formd · VS Code 图标提案</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #eeebe4; color: #211e19; font-family: system-ui, sans-serif; }
main { max-width: 1220px; margin: auto; padding: 58px 36px 54px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; border-bottom: 1px solid #bdb5a7; padding-bottom: 24px; margin-bottom: 26px; }
h1 { font: 56px Georgia, serif; letter-spacing: -.055em; margin: 0; }
header p { color: #514a40; margin: 5px 0 0; font-size: 14px; }
.current { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.current img { width: 32px; height: 32px; }
.grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 16px; }
article { min-width: 0; padding: 12px; background: #faf8f3; border: 1px solid #dbd5ca; }
.art { display: grid; place-items: center; aspect-ratio: 1.14; background: color-mix(in srgb, var(--wash) 86%, white); }
.art img { width: 65%; display: block; }
h2 { margin: 17px 4px 5px; font-size: 20px; }
article p { margin: 0 4px; min-height: 48px; font-size: 13px; line-height: 1.65; color: #514a40; }
.samples { display: grid; grid-template-columns: repeat(3,1fr); border-top: 1px solid #dbd5ca; margin-top: 13px; padding-top: 12px; text-align: center; }
.samples div { display: grid; justify-items: center; gap: 6px; color: #514a40; font-size: 11px; }
.samples b { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 4px; }
.dark { background: #252526; }
.light { background: #ebebeb; }
@media (max-width: 950px) { .grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media (max-width: 500px) { main { padding: 26px 16px; } .grid { grid-template-columns: 1fr; } }
</style>
<main>
<header><div><h1>Formd</h1><p>VS Code 扩展图标提案</p></div>
<p class="current"><img src="../../apps/vscode/media/formd-marketplace.svg" alt="">现版</p></header>
<div class="grid">
<article>
  <div class="art" style="--wash:#222044"><img src="ligature-marketplace.svg" alt="连字彩色图标"></div>
  <h2>连字</h2><p>把井号与 F 合成一个字标，延续现有的斜势。</p>
  <div class="samples">
    <div><img src="ligature-marketplace.svg" width="32" height="32" alt="32 px 商店图标"><span>32 px</span></div>
    <div><b class="dark"><img src="ligature-activity-bar.svg" width="24" height="24" alt="深色侧栏图标"></b><span>深色侧栏</span></div>
    <div><b class="light"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256"><g transform="translate(-20 -20) scale(1.16)"><path fill="#424242" d="M88 55h25l-7 38h31l7-38h65l-4 24h-43l-3 14h35l-4 23h-35l-5 28h32l-4 23h-32l-6 34h-25l6-34H93l-6 34H62l6-34H42l4-23h26l5-28H51l4-23h26Zm14 61-5 28h30l5-28Z" fill-rule="evenodd"/></g></svg></b><span>浅色侧栏</span></div>
  </div>
</article>
<article>
  <div class="art" style="--wash:#152D2A"><img src="fold-marketplace.svg" alt="折页彩色图标"></div>
  <h2>折页</h2><p>用一笔折出纸页和 F，保留 Markdown 文档的联想。</p>
  <div class="samples">
    <div><img src="fold-marketplace.svg" width="32" height="32" alt="32 px 商店图标"><span>32 px</span></div>
    <div><b class="dark"><img src="fold-activity-bar.svg" width="24" height="24" alt="深色侧栏图标"></b><span>深色侧栏</span></div>
    <div><b class="light"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256"><g transform="translate(-20 -20) scale(1.16)"><path fill="#424242" d="M66 56h89l36 36v22h-78v23h58l-25 26h-33v37l-47-36Zm24 24v72l23 18v-33H90v-23h23V92h42l-12-12Z" fill-rule="evenodd"/><path fill="#424242" d="M155 56v36h36Z"/></g></svg></b><span>浅色侧栏</span></div>
  </div>
</article>
<article>
  <div class="art" style="--wash:#291E19"><img src="insertion-marketplace.svg" alt="插入点彩色图标"></div>
  <h2>插入点</h2><p>把文字行与插入光标组合成 F，突出编辑器属性。</p>
  <div class="samples">
    <div><img src="insertion-marketplace.svg" width="32" height="32" alt="32 px 商店图标"><span>32 px</span></div>
    <div><b class="dark"><img src="insertion-activity-bar.svg" width="24" height="24" alt="深色侧栏图标"></b><span>深色侧栏</span></div>
    <div><b class="light"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256"><g transform="translate(-20 -20) scale(1.16)"><path fill="#424242" d="M54 68h102v23H54zm0 47h76v23H54zm0 47h51v23H54z"/><path fill="#424242" d="M155 114h14l13 11 13-11h14v21h-7l-9 8v34l9 8h7v21h-14l-13-11-13 11h-14v-21h7l9-8v-34l-9-8h-7Z"/></g></svg></b><span>浅色侧栏</span></div>
  </div>
</article>
<article>
  <div class="art" style="--wash:#1C2329"><img src="incision-marketplace.svg" alt="切面彩色图标"></div>
  <h2>切面</h2><p>以负空间切出 F，让轮廓在小尺寸时也容易辨认。</p>
  <div class="samples">
    <div><img src="incision-marketplace.svg" width="32" height="32" alt="32 px 商店图标"><span>32 px</span></div>
    <div><b class="dark"><img src="incision-activity-bar.svg" width="24" height="24" alt="深色侧栏图标"></b><span>深色侧栏</span></div>
    <div><b class="light"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256"><g transform="translate(-20 -20) scale(1.16)"><path fill="#424242" d="M67 55h135l-31 33h-60v28h56l-29 31h-27v54H54V74Z"/><path fill="#424242" d="m156 159 42-45v45Z"/></g></svg></b><span>浅色侧栏</span></div>
  </div>
</article>
</div>
</main>
</html>
